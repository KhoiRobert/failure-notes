# Clone the repo and run: docker-compose up
# Then open:
#   - Frontend: http://localhost:3000
#   - API docs: http://localhost:8000/docs

services:
  postgres:
    image: postgres:16-alpine
    container_name: failure_notes_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: failure_notes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./notes
      dockerfile: Dockerfile
    container_name: failure_notes_api
    env_file:
      - ./notes/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/failure_notes
      HOST: "0.0.0.0"
      PORT: "8000"
      DEBUG: "true"
      ENVIRONMENT: development
      SECRET_KEY: dev-secret-key-change-in-production-min-32-chars-long
      JWT_SECRET_KEY: dev-jwt-secret-key-change-in-production-min-32-chars
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: failure_notes_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
